
name: AeroFold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate AeroFold
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat

      - name: Check merge conflict markers
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path(".gitignore")]
          files += list(Path(".github/workflows").glob("*.yml"))

          markers = ("<<<<<<< ", "=======", ">>>>>>> ")
          for path in files:
              for line in path.read_text().splitlines():
                  if line.startswith(markers):
                      raise SystemExit(
                          f"Merge conflict marker in {path}"
                      )
          print("No merge conflict markers found")
          PY

      - name: Validate Jupyter notebook
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path

          notebooks = list(Path(".").rglob("*.ipynb"))
          notebooks = [
              p for p in notebooks
              if ".ipynb_checkpoints" not in p.parts
              and ".venv" not in p.parts
          ]

          assert notebooks, "No notebooks found"

          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              print(f"Valid notebook: {path}")
          PY

      - name: Compile Python files
        run: |
          python -m compileall -q -x '/\.git/' .

      - name: Verify required project files
        run: |
          test -f README.md
          test -f requirements.txt
          test -f AeroFold_lab.ipynb
          echo "Required project files exist"

      - name: CI completed
        run: echo "AeroFold validation passed!"
 
  test:
    name: ML Benchmark Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run ML tests
        run: |
          python -m pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-results
          path: test-results.xml
          if-no-files-found: ignore
 